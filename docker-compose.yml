services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    expose: ["8050"]          # not published on the host; only reachable via the tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]
    restart: unless-stopped
